name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "data_layer/**"
      - "research/**"
      - "backtest/**"
      - "execution/**"
      - "ops/**"
      - "pyproject.toml"
  workflow_dispatch: {}
  schedule:
    # Nightly rebuild catches drift when source-of-truth files
    # (CLAUDE.md, framework survey) are updated outside the docs folder.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies (docs group)
        run: uv sync --extra docs --frozen
      - name: Build site (no --strict: griffe emits 14 cosmetic docstring-formatting warnings on the current codebase; --strict treats them as errors but the rendered output is correct. We catch actual broken-link / missing-target failures via the build's exit code + warnings.)
        run: uv run mkdocs build --clean
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4