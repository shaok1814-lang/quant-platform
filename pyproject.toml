[project]
name = "quant-platform"
version = "0.1.0"
description = "Personal quantitative trading research platform for A-shares"
requires-python = ">=3.11"

dependencies = [
    # === Data Sources ===
    # akshare (primary) + adata (validator) provide all needed A-share data
    # including realtime quotes. Ashare (mpquant/Ashare) was considered as a
    # realtime supplement but is git-only and redundant with akshare.
    # tushare is kept for cross-validation only; requires TUSHARE_TOKEN env var.
    "akshare>=1.16.0",
    "adata>=1.0.0",
    "tushare>=1.4.0",
    # === Storage ===
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    # === Core Engine ===
    "akquant>=0.1.0",
    # === Analysis & Computation ===
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "optuna>=4.0.0",
    # === Fast Scanning (optional but recommended) ===
    "vectorbt>=0.26.0",
    # === Visualization & Dashboard ===
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    # === Ops: Scheduling & Logging ===
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    # === Notifications (DingTalk webhook) ===
    "requests>=2.32.0",
    "baostock>=0.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

# === Ruff (linter + formatter) ===
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["data_layer", "research", "backtest", "execution", "ops"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (formatter handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF003"]  # RUF003: tests use Chinese full-width punctuation in comments
"data_layer/*" = ["RUF002", "RUF003"]  # RUF002/RUF003: Chinese docstrings use full-width punctuation by convention

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# === Mypy (type checker) ===
[tool.mypy]
# Bumped from 3.11 → 3.12: numpy >= 2.x ships PEP 695 `type X = ...`
# aliases in its .pyi stubs, which mypy only accepts on Python 3.12+.
# CLAUDE.md sets the floor at "3.11+", so 3.12 is in-range.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true  # many quant libs lack type stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# === Pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Make project-root top-level packages (data_layer/, research/, ...)
# importable from tests. Without this, pytest's default rootdir
# resolution won't add cwd to sys.path and ``import data_layer`` fails.
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
# Registered markers (kept in sync with @pytest.mark.<x> usages).
# Adding a new marker without registering here breaks --strict-markers.
markers = [
    "ashare: A-share rule layer tests (W4 backtest/a_share/*).",
    "network: tests that hit akshare / external network (skipped by default; opt in with -m network).",
    "slow: tests that take > 1s (e.g. real-AKQuant walk-forward e2e). Skipped by default; opt in with -m slow.",
]

# === Coverage ===
[tool.coverage.run]
source = ["data_layer", "research", "backtest", "execution", "ops"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
