# A-share universe for ops/ingest_job.
#
# Curated to span sectors with enough liquidity for backtests / paper
# trading. 30+ symbols as of 2026-08-29. Edit ``ops.scheduler`` or
# this file directly to extend; ``ops.universe.load_universe`` validates
# at startup and refuses to schedule a job with a malformed list.
#
# Schema (each entry): {symbol, name, sector}.
#   * ``symbol`` MUST be 6 digits (akshare requirement).
#   * ``sector`` is a free-form tag, used for grouped diagnostics
#     (``by_sector`` breakdown in 钉钉 alerts).
#
# Sources (2026-08-29):
#   * Banks: 600000, 601398, 601288, 601939, 600036, 601166, 000001
#   * Liquor / consumer staples: 600519, 000858, 600887, 600690
#   * Tech / internet: 002594, 300750, 300059, 600276, 002475
#   * Healthcare: 600276 (overlap with tech), 000661, 600436
#   * Industrials / energy: 600028, 601857, 601012, 601628, 600585
#   * ETFs (broad index proxy): 510300, 510500, 510050, 510880
#   * Real estate / utilities: 600030, 600900, 600886
#   * Auto / new energy: 002594 (overlap), 601238, 601633
